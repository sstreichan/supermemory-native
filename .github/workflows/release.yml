name: Release Assets Builder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compile Cross-Platform Static Binaries
        run: |
          mkdir -p dist
          
          # Linux Builds
          echo "Compiling Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/supermemory-native-linux-amd64 ./cmd/supermemory-native
          
          echo "Compiling Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/supermemory-native-linux-arm64 ./cmd/supermemory-native
          
          # macOS Builds
          echo "Compiling macOS amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/supermemory-native-darwin-amd64 ./cmd/supermemory-native
          
          echo "Compiling macOS arm64 (M1/M2/M3)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/supermemory-native-darwin-arm64 ./cmd/supermemory-native
          
          # Windows Build
          echo "Compiling Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/supermemory-native-windows-amd64.exe ./cmd/supermemory-native

      - name: Upload Binaries to Release Tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
